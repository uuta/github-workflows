name: OpenRouter PR Review

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter API key used only for PR-Agent inference
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Validates the trigger without touching secrets or concurrency: rejected
  # events must never cancel an in-progress authorized review, so the
  # PR-keyed cancellable concurrency group lives only on the review job that
  # requires this gate's approval.
  gate:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.action == 'created'
        && github.event.issue.pull_request != null
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.command_gate.outputs.execute }}
    steps:
      - name: Check for a /review command
        id: command_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trimmed="${COMMENT_BODY#"${COMMENT_BODY%%[![:space:]]*}"}"
          first_word="${trimmed%%[[:space:]]*}"
          if [ "$first_word" = "/review" ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Comment does not start with the /review command; skipping PR-Agent."
            echo "execute=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: gate
    if: needs.gate.outputs.execute == 'true'
    concurrency:
      group: openrouter-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record review start time
        id: review_start
        shell: bash
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Review pull request with PR-Agent
        uses: The-PR-Agent/pr-agent@4ebd5c5333c6ef21509e7304d27969eb825e6f22 # v0.43.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG.MODEL: openrouter/z-ai/glm-5.2
          CONFIG.FALLBACK_MODELS: '["openrouter/minimax/minimax-m3"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"
          CONFIG.MAX_MODEL_TOKENS: "64000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_code_suggestions.focus_only_on_problems: "false"

      - name: Verify PR-Agent published a review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_STARTED_AT: ${{ steps.review_start.outputs.timestamp }}
        run: |
          set -euo pipefail

          comments="$(
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          )"

          if ! jq -e --arg started_at "$REVIEW_STARTED_AT" '
            any(
              .[][];
              .user.login == "github-actions[bot]"
              and ((.body // "") | contains("## PR Reviewer Guide"))
              and ((.updated_at // "") >= $started_at)
            )
          ' <<<"$comments" >/dev/null; then
            echo "::error::PR-Agent exited without publishing or updating its PR review comment."
            exit 1
          fi
